apiVersion: apps/v1
kind: Deployment
metadata:
  name: scim-server
spec:
  replicas: 3
  template:
    spec:
      containers:
      - name: scim-server
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: scim-server
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: scim-server
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

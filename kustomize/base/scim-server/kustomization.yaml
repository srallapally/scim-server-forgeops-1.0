apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - secret-template.yaml
  - ingress.yaml

commonLabels:
  app: scim-server
  component: scim

images:
  - name: scim-server
    newName: scim-server
    newTag: "1.0.0"

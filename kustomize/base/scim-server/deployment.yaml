apiVersion: apps/v1
kind: Deployment
metadata:
  name: scim-server
  labels:
    app: scim-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: scim-server
  template:
    metadata:
      labels:
        app: scim-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      
      containers:
      - name: scim-server
        image: scim-server
        imagePullPolicy: IfNotPresent
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
              - ALL
        
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        env:
        - name: PORT
          value: "8080"
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m"
        - name: PINGIDM_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: scim-server-config
              key: pingidm-base-url
        - name: OAUTH_TOKEN_URL
          valueFrom:
            configMapKeyRef:
              name: scim-server-config
              key: oauth-token-url
        - name: OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: scim-server-secrets
              key: oauth-client-id
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: scim-server-secrets
              key: oauth-client-secret
        - name: OAUTH_SCOPE
          valueFrom:
            configMapKeyRef:
              name: scim-server-config
              key: oauth-scope
              optional: true
        - name: SCIM_SERVER_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: scim-server-config
              key: scim-server-base-url
        - name: SCIM_REALM
          value: "scim"
        - name: PINGIDM_MANAGED_USER_OBJECT
          valueFrom:
            configMapKeyRef:
              name: scim-server-config
              key: managed-user-object
        - name: PINGIDM_MANAGED_ROLE_OBJECT
          valueFrom:
            configMapKeyRef:
              name: scim-server-config
              key: managed-role-object
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
